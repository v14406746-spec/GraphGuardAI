[project]
name = "graphguard-ai"
version = "0.1.0"
description = "FalkorDB AI Security Investigation Agent"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.8",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "openai>=1.14.0",
]

[tool.vercel]
entrypoint = "backend.main:app"